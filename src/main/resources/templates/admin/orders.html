<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('전체 주문 관리')}">
  <meta charset="UTF-8"/><title>전체 주문</title>
</head>
<body>
<nav th:replace="~{layout/base :: nav}"></nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">전체 주문 관리</h4>
    <div class="d-flex gap-2">
      <a th:href="@{/admin/products}" class="btn btn-outline-secondary btn-sm">상품 가격 관리</a>
      <a th:href="@{/admin/refunds}" class="btn btn-outline-warning btn-sm">환불 요청</a>
    </div>
  </div>

  <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div th:if="${orders.empty}" class="text-center py-5 text-muted">
    <i class="bi bi-inbox display-4 d-block mb-3"></i>
    <p>주문이 없습니다.</p>
  </div>

  <div class="card shadow-sm border-0" th:unless="${orders.empty}">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-3">주문번호</th>
              <th>회원</th>
              <th>주문일시</th>
              <th class="text-end">총액</th>
              <th class="text-center">상태</th>
              <th class="text-center pe-3">액션</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="order : ${orders}">
              <td class="ps-3 text-muted small">#<span th:text="${order.orderId}"></span></td>
              <td class="small" th:text="${order.user.email}"></td>
              <td class="small" th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
              <td class="text-end fw-bold"
                  th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')} + '원'"></td>
              <td class="text-center">
                <span class="status-badge" th:classappend="'st-' + ${order.status.name()}"
                      th:text="${order.status}"></span>
              </td>
              <td class="text-center pe-3">
                <form th:if="${order.status.name() == 'PAID'}"
                      th:action="@{/admin/orders/{id}/ship(id=${order.orderId})}" method="post"
                      class="d-inline">
                  <button type="submit" class="btn btn-info btn-sm">
                    <i class="bi bi-box-seam me-1"></i>출고
                  </button>
                </form>
                <form th:if="${order.status.name() == 'PREPARING'}"
                      th:action="@{/admin/orders/{id}/shipping(id=${order.orderId})}" method="post"
                      class="d-inline">
                  <button type="submit" class="btn btn-primary btn-sm">
                    <i class="bi bi-truck me-1"></i>배송 진행
                  </button>
                </form>
                <form th:if="${order.status.name() == 'SHIPPING'}"
                      th:action="@{/admin/orders/{id}/delivered(id=${order.orderId})}" method="post"
                      class="d-inline">
                  <button type="submit" class="btn btn-success btn-sm">
                    <i class="bi bi-house-check me-1"></i>배송 완료
                  </button>
                </form>
                <span th:if="${order.status.name() != 'PAID' and order.status.name() != 'PREPARING' and order.status.name() != 'SHIPPING'}"
                      class="text-muted small">-</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
