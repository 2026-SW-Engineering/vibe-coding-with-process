<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('상품 가격 관리')}">
  <meta charset="UTF-8"/><title>상품 가격 관리</title>
</head>
<body>
<nav th:replace="~{layout/base :: nav}"></nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">상품 가격 관리</h4>
    <a th:href="@{/admin/orders}" class="btn btn-outline-secondary btn-sm">전체 주문 목록</a>
  </div>

  <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-3">상품명</th>
              <th class="text-end">현재 가격</th>
              <th class="text-center">재고</th>
              <th class="text-center pe-3" style="width:220px">가격 변경</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="product : ${products}">
              <td class="ps-3 fw-semibold" th:text="${product.name}"></td>
              <td class="text-end text-success fw-bold"
                  th:text="${#numbers.formatInteger(product.currentPrice, 0, 'COMMA')} + '원'"></td>
              <td class="text-center" th:text="${product.stock}"></td>
              <td class="text-center pe-3">
                <form th:action="@{/admin/products/{id}/price(id=${product.productId})}" method="post"
                      class="d-flex gap-2 justify-content-center">
                  <input type="number" name="newPrice" th:value="${product.currentPrice}"
                         min="1" class="form-control form-control-sm" style="width:100px"/>
                  <button type="submit" class="btn btn-outline-primary btn-sm">변경</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
