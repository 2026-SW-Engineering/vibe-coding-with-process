<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('로그인')}">
  <meta charset="UTF-8"/><title>로그인</title>
</head>
<body>
<nav th:replace="~{layout/base :: nav}"></nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height:calc(100vh - 60px)">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="card-title mb-4 text-center fw-bold">로그인</h4>

        <div th:if="${param.error}" class="alert alert-danger py-2">
          이메일 또는 비밀번호가 올바르지 않습니다.
        </div>
        <div th:if="${param.registered}" class="alert alert-success py-2">
          회원가입이 완료되었습니다. 로그인해 주세요.
        </div>

        <form th:action="@{/auth/login}" method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">이메일</label>
            <input type="email" name="username" class="form-control" placeholder="example@email.com" required autofocus/>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">비밀번호</label>
            <input type="password" name="password" class="form-control" placeholder="비밀번호" required/>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">로그인</button>
          </div>
        </form>

        <hr class="my-3"/>
        <p class="text-center text-muted small mb-0">
          계정이 없으신가요? <a th:href="@{/auth/register}" class="text-decoration-none">회원가입</a>
        </p>
      </div>
    </div>
  </div>
</div>

<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
