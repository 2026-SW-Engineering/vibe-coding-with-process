<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('회원가입')}">
  <meta charset="UTF-8"/><title>회원가입</title>
</head>
<body>
<nav th:replace="~{layout/base :: nav}"></nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height:calc(100vh - 60px)">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="card-title mb-4 text-center fw-bold">회원가입</h4>

        <div th:if="${errorMessage}" class="alert alert-danger py-2" th:text="${errorMessage}"></div>

        <form th:action="@{/auth/register}" th:object="${form}" method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">이름</label>
            <input type="text" th:field="*{name}" class="form-control" placeholder="이름" required/>
            <div th:if="${#fields.hasErrors('name')}" class="text-danger small mt-1" th:errors="*{name}"></div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">이메일</label>
            <input type="email" th:field="*{email}" class="form-control" placeholder="example@email.com" required/>
            <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-1" th:errors="*{email}"></div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">비밀번호 <span class="text-muted fw-normal small">(8자 이상)</span></label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="8자 이상" required/>
            <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1" th:errors="*{password}"></div>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">가입하기</button>
          </div>
        </form>

        <hr class="my-3"/>
        <p class="text-center text-muted small mb-0">
          이미 계정이 있으신가요? <a th:href="@{/auth/login}" class="text-decoration-none">로그인</a>
        </p>
      </div>
    </div>
  </div>
</div>

<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
