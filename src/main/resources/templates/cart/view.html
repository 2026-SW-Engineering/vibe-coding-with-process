<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('장바구니')}">
  <meta charset="UTF-8"/><title>장바구니</title>
</head>
<body>
<nav th:replace="~{layout/base :: nav}"></nav>

<div class="container py-4">
  <h4 class="fw-bold mb-4">장바구니</h4>

  <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div th:if="${cart.items.empty}" class="text-center py-5 text-muted">
    <i class="bi bi-cart-x display-4 d-block mb-3"></i>
    <p>장바구니가 비어 있습니다.</p>
    <a th:href="@{/products}" class="btn btn-primary mt-2">상품 둘러보기</a>
  </div>

  <form th:action="@{/orders}" method="post" th:unless="${cart.items.empty}">
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3"><input type="checkbox" class="form-check-input" id="checkAll"/></th>
                <th>상품명</th>
                <th class="text-end">현재 가격</th>
                <th class="text-center">수량</th>
                <th class="text-end">소계</th>
                <th class="text-center">수량 변경</th>
                <th class="text-center">삭제</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${cart.items}">
                <td class="ps-3">
                  <input type="checkbox" class="form-check-input item-check"
                         name="selectedItemIds" th:value="${item.cartItemId}" checked/>
                </td>
                <td class="fw-semibold" th:text="${item.product.name}"></td>
                <td class="text-end"
                    th:text="${#numbers.formatInteger(item.product.currentPrice, 0, 'COMMA')} + '원'"></td>
                <td class="text-center" th:text="${item.quantity}"></td>
                <td class="text-end fw-bold text-success"
                    th:text="${#numbers.formatInteger(item.product.currentPrice * item.quantity, 0, 'COMMA')} + '원'"></td>
                <td class="text-center">
                  <form th:action="@{/cart/items/{id}/quantity(id=${item.cartItemId})}" method="post"
                        class="d-flex justify-content-center gap-1">
                    <input type="number" name="quantity" th:value="${item.quantity}" min="1"
                           class="form-control form-control-sm" style="width:65px"/>
                    <button type="submit" class="btn btn-outline-secondary btn-sm">변경</button>
                  </form>
                </td>
                <td class="text-center">
                  <form th:action="@{/cart/items/{id}/delete(id=${item.cartItemId})}" method="post">
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                      <i class="bi bi-trash"></i>
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h5 class="fw-bold mb-3">배송 정보</h5>
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label fw-semibold">배송 주소</label>
            <input type="text" name="address" class="form-control" placeholder="배송 주소를 입력하세요" required/>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">전화번호</label>
            <input type="text" name="phone" class="form-control" placeholder="010-0000-0000" required/>
          </div>
        </div>
        <div class="d-flex justify-content-end mt-4">
          <button type="submit" class="btn btn-primary btn-lg px-5">
            <i class="bi bi-bag-check me-2"></i>선택 항목 주문하기
          </button>
        </div>
      </div>
    </div>
  </form>
</div>

<script>
  document.getElementById('checkAll')?.addEventListener('change', function() {
    document.querySelectorAll('.item-check').forEach(cb => cb.checked = this.checked);
  });
</script>
<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
