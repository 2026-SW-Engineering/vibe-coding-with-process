<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ── head fragment ──────────────────────────────────────── -->
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle} + ' | 쇼핑몰'">쇼핑몰</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body { background-color: #f8f9fa; }
    .status-badge { font-size: .8rem; padding: .35em .65em; border-radius: .4rem; color: #fff; display: inline-block; }
    .st-PAYMENT_PENDING  { background: #ffc107; color: #000; }
    .st-PAID             { background: #198754; }
    .st-PREPARING        { background: #0dcaf0; color: #000; }
    .st-SHIPPING         { background: #0d6efd; }
    .st-DELIVERED        { background: #20c997; }
    .st-CANCELLED        { background: #6c757d; }
    .st-REFUND_REQUESTED { background: #fd7e14; }
    .st-PARTIALLY_REFUNDED { background: #6f42c1; }
    .st-ORDERED  { background: #0d6efd; }
    .st-REFUNDED { background: #6c757d; }
  </style>
</head>

<!-- ── nav fragment ───────────────────────────────────────── -->
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/products}">ShopOrder</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/products}"><i class="bi bi-grid-3x3-gap me-1"></i>상품 목록</a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:href="@{/cart}"><i class="bi bi-cart3 me-1"></i>장바구니</a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:href="@{/orders}"><i class="bi bi-bag me-1"></i>내 주문</a>
        </li>
        <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">관리자</a>
          <ul class="dropdown-menu dropdown-menu-dark">
            <li><a class="dropdown-item" th:href="@{/admin/orders}">전체 주문</a></li>
            <li><a class="dropdown-item" th:href="@{/admin/products}">상품 가격 관리</a></li>
            <li><a class="dropdown-item" th:href="@{/admin/refunds}">환불 요청</a></li>
          </ul>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item" sec:authorize="isAnonymous()">
          <a class="nav-link" th:href="@{/auth/login}">로그인</a>
        </li>
        <li class="nav-item" sec:authorize="isAnonymous()">
          <a class="nav-link" th:href="@{/auth/register}">회원가입</a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <span class="navbar-text text-light me-3">
            <i class="bi bi-person-circle me-1"></i><span sec:authentication="name"></span>
          </span>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <form th:action="@{/auth/logout}" method="post" class="d-inline m-0">
            <button class="btn btn-outline-light btn-sm" type="submit">로그아웃</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ── scripts fragment ───────────────────────────────────── -->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</html>
