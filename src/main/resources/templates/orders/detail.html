<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('주문 상세')}">
  <meta charset="UTF-8"/><title>주문 상세</title>
</head>
<body>
<nav th:replace="~{layout/base :: nav}"></nav>

<div class="container py-4" style="max-width:800px">
  <div class="d-flex align-items-center mb-4 gap-3">
    <a th:href="@{/orders}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i>목록
    </a>
    <h4 class="fw-bold mb-0">주문 상세</h4>
  </div>

  <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- 주문 요약 -->
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
      <span class="fw-semibold">주문 #<span th:text="${order.orderId}"></span></span>
      <span class="status-badge" th:classappend="'st-' + ${order.status.name()}"
            th:text="${order.status}"></span>
    </div>
    <div class="card-body">
      <dl class="row mb-0">
        <dt class="col-sm-3 text-muted">주문일시</dt>
        <dd class="col-sm-9" th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></dd>
        <dt class="col-sm-3 text-muted">배송지</dt>
        <dd class="col-sm-9" th:text="${order.address}"></dd>
        <dt class="col-sm-3 text-muted">전화번호</dt>
        <dd class="col-sm-9 mb-0" th:text="${order.phone}"></dd>
      </dl>
    </div>
  </div>

  <!-- 주문 항목 -->
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white fw-semibold py-3">주문 항목</div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-3">상품명</th>
              <th class="text-center">수량</th>
              <th class="text-end">확정 가격</th>
              <th class="text-end">소계</th>
              <th class="text-center pe-3">항목 상태</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${order.items}">
              <td class="ps-3 fw-semibold" th:text="${item.product.name}"></td>
              <td class="text-center" th:text="${item.quantity}"></td>
              <td class="text-end"
                  th:text="${#numbers.formatInteger(item.confirmedPrice, 0, 'COMMA')} + '원'"></td>
              <td class="text-end fw-bold"
                  th:text="${#numbers.formatInteger(item.confirmedPrice * item.quantity, 0, 'COMMA')} + '원'"></td>
              <td class="text-center pe-3">
                <span class="status-badge" th:classappend="'st-' + ${item.itemStatus.name()}"
                      th:text="${item.itemStatus}"></span>
              </td>
            </tr>
          </tbody>
          <tfoot class="table-light">
            <tr>
              <td colspan="3" class="text-end fw-bold ps-3">총 결제 금액</td>
              <td class="text-end fw-bold text-success fs-5">
                <span th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')} + '원'"></span>
              </td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <!-- 전체 취소: PAID or PREPARING -->
  <div class="card shadow-sm border-0 mb-4"
       th:if="${order.status.name() == 'PAID' or order.status.name() == 'PREPARING'}">
    <div class="card-body">
      <h6 class="fw-bold text-danger mb-2">주문 취소</h6>
      <p class="text-muted small mb-3">취소 시 재고가 즉시 복원되며 되돌릴 수 없습니다.</p>
      <form th:action="@{/orders/{id}/cancel(id=${order.orderId})}" method="post">
        <button type="submit" class="btn btn-outline-danger"
                onclick="return confirm('정말 주문을 취소하시겠습니까?')">
          <i class="bi bi-x-circle me-1"></i>주문 전체 취소
        </button>
      </form>
    </div>
  </div>

  <!-- 부분 환불 요청: DELIVERED + 7일 이내 -->
  <div class="card shadow-sm border-0 mb-4" th:if="${canRefund}">
    <div class="card-header bg-white fw-semibold py-3">부분 환불 요청</div>
    <div class="card-body">
      <p class="text-muted small mb-3">환불할 수량을 입력하고 요청하세요. (0 입력 시 해당 항목 제외)</p>
      <form th:action="@{/orders/{id}/refund(id=${order.orderId})}" method="post">
        <div class="table-responsive mb-3">
          <table class="table align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>상품명</th>
                <th class="text-center">주문 수량</th>
                <th class="text-center" style="width:110px">환불 수량</th>
                <th class="text-end">확정 가격</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${order.items}">
                <td class="fw-semibold" th:text="${item.product.name}"></td>
                <td class="text-center" th:text="${item.quantity}"></td>
                <td class="text-center">
                  <input type="hidden" name="orderItemIds" th:value="${item.orderItemId}"/>
                  <input type="number" name="quantities" min="0" th:max="${item.quantity}"
                         value="0" class="form-control form-control-sm text-center"/>
                </td>
                <td class="text-end"
                    th:text="${#numbers.formatInteger(item.confirmedPrice, 0, 'COMMA')} + '원'"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">환불 사유</label>
          <input type="text" name="reason" class="form-control" placeholder="환불 사유를 입력하세요"/>
        </div>
        <button type="submit" class="btn btn-warning">
          <i class="bi bi-arrow-counterclockwise me-1"></i>환불 요청 접수
        </button>
      </form>
    </div>
  </div>

  <!-- 환불 대기 중 -->
  <div class="alert alert-warning d-flex align-items-center gap-2"
       th:if="${order.status.name() == 'REFUND_REQUESTED'}">
    <i class="bi bi-hourglass-split fs-5"></i>
    <span>환불 요청이 접수되었습니다. 관리자 승인을 대기 중입니다.</span>
  </div>

  <!-- 부분 환불 완료 -->
  <div class="alert alert-success d-flex align-items-center gap-2"
       th:if="${order.status.name() == 'PARTIALLY_REFUNDED'}">
    <i class="bi bi-check-circle fs-5"></i>
    <span>부분 환불이 처리되었습니다.</span>
  </div>
</div>

<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
