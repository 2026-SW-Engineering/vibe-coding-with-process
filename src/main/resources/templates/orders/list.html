<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('내 주문 목록')}">
  <meta charset="UTF-8"/><title>내 주문</title>
</head>
<body>
<nav th:replace="~{layout/base :: nav}"></nav>

<div class="container py-4">
  <h4 class="fw-bold mb-4">내 주문 목록</h4>

  <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div th:if="${orders.empty}" class="text-center py-5 text-muted">
    <i class="bi bi-bag-x display-4 d-block mb-3"></i>
    <p>주문 내역이 없습니다.</p>
    <a th:href="@{/products}" class="btn btn-primary mt-2">상품 둘러보기</a>
  </div>

  <div class="card shadow-sm border-0" th:unless="${orders.empty}">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-3">주문번호</th>
              <th>주문일시</th>
              <th class="text-end">총액</th>
              <th class="text-center">상태</th>
              <th class="text-center pe-3">상세</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="order : ${orders}">
              <td class="ps-3 fw-semibold text-muted small">#<span th:text="${order.orderId}"></span></td>
              <td class="small" th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
              <td class="text-end fw-bold"
                  th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')} + '원'"></td>
              <td class="text-center">
                <span class="status-badge" th:classappend="'st-' + ${order.status.name()}"
                      th:text="${order.status}"></span>
              </td>
              <td class="text-center pe-3">
                <a th:href="@{/orders/{id}(id=${order.orderId})}" class="btn btn-outline-primary btn-sm">
                  상세보기
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
