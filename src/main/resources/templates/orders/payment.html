<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('결제')}">
  <meta charset="UTF-8"/><title>결제</title>
</head>
<body>
<nav th:replace="~{layout/base :: nav}"></nav>

<div class="container py-4" style="max-width:720px">
  <div class="d-flex align-items-center mb-4 gap-3">
    <a th:href="@{/cart}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i>장바구니
    </a>
    <h4 class="fw-bold mb-0">결제</h4>
  </div>

  <div th:if="${warning}" class="alert alert-warning">
    <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${warning}"></span>
  </div>

  <!-- 주문 내역 -->
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white fw-semibold py-3">주문 내역</div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-3">상품명</th>
              <th class="text-center">수량</th>
              <th class="text-end">확정 가격</th>
              <th class="text-end pe-3">소계</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${order.items}">
              <td class="ps-3 fw-semibold" th:text="${item.product.name}"></td>
              <td class="text-center" th:text="${item.quantity}"></td>
              <td class="text-end"
                  th:text="${#numbers.formatInteger(item.confirmedPrice, 0, 'COMMA')} + '원'"></td>
              <td class="text-end pe-3 fw-bold"
                  th:text="${#numbers.formatInteger(item.confirmedPrice * item.quantity, 0, 'COMMA')} + '원'"></td>
            </tr>
          </tbody>
          <tfoot class="table-light">
            <tr>
              <td colspan="3" class="text-end fw-bold ps-3">총 결제 금액</td>
              <td class="text-end pe-3 fw-bold text-success fs-5"
                  th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')} + '원'"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <!-- 배송 정보 -->
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white fw-semibold py-3">배송 정보</div>
    <div class="card-body">
      <dl class="row mb-0">
        <dt class="col-sm-3 text-muted">배송지</dt>
        <dd class="col-sm-9" th:text="${order.address}"></dd>
        <dt class="col-sm-3 text-muted">전화번호</dt>
        <dd class="col-sm-9 mb-0" th:text="${order.phone}"></dd>
      </dl>
    </div>
  </div>

  <!-- Mock 결제 -->
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white fw-semibold py-3">
      결제 수단 <span class="badge bg-secondary ms-2">Mock</span>
    </div>
    <div class="card-body">
      <p class="text-muted small mb-3">테스트용 결제입니다. 성공 또는 실패를 선택하세요.</p>
      <form th:action="@{/orders/{id}/payment(id=${order.orderId})}" method="post">
        <div class="d-flex gap-3">
          <button type="submit" name="success" value="true" class="btn btn-success btn-lg flex-fill">
            <i class="bi bi-check-circle me-2"></i>결제 완료
          </button>
          <button type="submit" name="success" value="false" class="btn btn-outline-danger btn-lg flex-fill">
            <i class="bi bi-x-circle me-2"></i>결제 실패
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
